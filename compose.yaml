services:
  postgres:
    image: postgres:16.8-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: burnin
      POSTGRES_USER: burnin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burnin -d burnin"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?Set APP_SESSION_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://burnin:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/burnin?sslmode=disable
      OIDC_TENANT_ID: ${OIDC_TENANT_ID:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - internal

volumes:
  postgres-data:

networks:
  internal:
