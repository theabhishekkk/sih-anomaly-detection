name: Free-tier deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      APP_HEALTHCHECK_URL: ${{ vars.APP_HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check deployment configuration
        run: |
          set -euo pipefail
          if [[ "$DATABASE_URL" != postgresql+psycopg://* ]]; then
            echo "Set production DATABASE_URL to the Supabase session-pooler SQLAlchemy URL." >&2
            exit 1
          fi
          if [[ -z "$RENDER_DEPLOY_HOOK" || -z "$APP_HEALTHCHECK_URL" ]]; then
            echo "Set RENDER_DEPLOY_HOOK and APP_HEALTHCHECK_URL in GitHub's production environment." >&2
            exit 1
          fi
          if [[ "$APP_HEALTHCHECK_URL" != https://* || "$APP_HEALTHCHECK_URL" == */ ]]; then
            echo "APP_HEALTHCHECK_URL must be the HTTPS Render origin without a trailing slash." >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -r backend/requirements.txt
      - name: Validate application
        run: |
          python -m pip_audit -r backend/requirements.txt
          python -m pytest backend/tests -q
          python -m ruff check backend --select E4,E7,E9,F
          node --check frontend/app.js
      - name: Apply database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Deploy to Render
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 10 "$APP_HEALTHCHECK_URL/health/ready"; then
              echo
              echo "Render app readiness check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Render app did not become ready within 10 minutes." >&2
          exit 1
