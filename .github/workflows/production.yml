name: Production

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python -m ruff check backend --select E4,E7,E9,F
      - run: node --check frontend/app.js
      - run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"

  deploy:
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
      MIGRATION_JOB_NAME: ${{ vars.MIGRATION_JOB_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer --output tsv)"
          az acr login --name "$ACR_NAME"
          IMAGE="$LOGIN_SERVER/burnin-api:$IMAGE_TAG"
          docker buildx build --platform linux/amd64 --tag "$IMAGE" --push .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"
      - name: Run database setup and migrations
        run: |
          set -euo pipefail
          az containerapp job update \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none
          EXECUTION="$(az containerapp job start \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query name --output tsv)"
          if [ -z "$EXECUTION" ]; then
            echo "Azure did not return the migration execution name." >&2
            exit 1
          fi
          for attempt in $(seq 1 40); do
            STATUS="$(az containerapp job execution show \
              --name "$MIGRATION_JOB_NAME" \
              --job-execution-name "$EXECUTION" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.status --output tsv 2>/dev/null || true)"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                az containerapp job logs show \
                  --name "$MIGRATION_JOB_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --execution "$EXECUTION" \
                  --container database-migrations || true
                echo "Database migration job ended with status $STATUS." >&2
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the database migration job." >&2
          exit 1
      - name: Deploy API image
        run: |
          set -euo pipefail
          APP_URL="https://$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars PORT=8000 WEB_CONCURRENCY=2 PUBLIC_BASE_URL="$APP_URL" \
            --output none
          az containerapp ingress update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --target-port 8000 \
            --transport auto \
            --output none
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            --retry-connrefused "$APP_URL/health/ready"
          echo "Application deployed at $APP_URL"
