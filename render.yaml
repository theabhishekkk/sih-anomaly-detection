services:
  - type: web
    name: sih-burnin
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
      - key: OIDC_TENANT_ID
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_ALLOWED_EMAILS
        sync: false
